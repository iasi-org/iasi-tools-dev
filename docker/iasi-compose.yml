services:

  plantuml:
    image: plantuml/plantuml-server:jetty
    container_name: iasi-plantuml
    gpus: all
    ports:
      - "10025:8080"
    networks:
      - iasi
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: iasi-ollama
    ports:
      - "10434:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - iasi
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    depends_on:
      - ollama
    ports:
      - "10300:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - open-webui:/app/backend/data
    networks:
      - iasi
    restart: unless-stopped

networks:
  iasi:
    name: iasi

volumes:
  ollama:
  open-webui:
